service: trendly-connect
frameworkVersion: '3'

provider:
  name: aws
  architecture: arm64
  runtime: provided.al2
  stage: ${opt:stage, 'dev'}

custom:
  domains:
    dev:
      - dev.connect.trendly.now
    prod:
      - connect.trendly.now

plugins:
  - serverless-lift

constructs:
  trendlyConnect:
    type: static-website
    # Next.js static export writes to out/ — matches next.config.js output:'export'
    path: out
    domain: ${self:custom.domains.${sls:stage}}
    # ACM certificate — must be in us-east-1 (required for CloudFront).
    # A wildcard *.trendly.now cert covers both dev and prod domains.
    certificate: REPLACE_ME  # arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/...
    # Shown when CloudFront returns a 403/404 (e.g. direct path not found)
    errorPage: /connect/error/index.html
    # Uncomment to redirect dev.connect.trendly.now → connect.trendly.now on prod
    # redirectToMainDomain: true

resources:
  Conditions:
    IsDev:
      Fn::Equals: ["${sls:stage}", "dev"]
    IsProd:
      Fn::Equals: ["${sls:stage}", "prod"]

  Resources:
    # Route53 records point the custom domain at the CloudFront distribution.
    # Z2FDTNDATAQYW2 is the CloudFront hosted zone ID — constant for all accounts.
    # ${construct:trendlyConnect.cname} is the CloudFront domain output by lift.
    Route53DevRecord:
      Condition: IsDev
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: REPLACE_ME  # Route53 hosted zone ID for trendly.now
        Name: dev.connect.trendly.now
        Type: A
        AliasTarget:
          HostedZoneId: Z2FDTNDATAQYW2
          DNSName: ${construct:trendlyConnect.cname}

    Route53ProdRecord:
      Condition: IsProd
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: REPLACE_ME  # Route53 hosted zone ID for trendly.now
        Name: connect.trendly.now
        Type: A
        AliasTarget:
          HostedZoneId: Z2FDTNDATAQYW2
          DNSName: ${construct:trendlyConnect.cname}
