name: Deploy Trendly Connect

on:
  push:
    branches:
      - master  # → prod
      - dev     # → dev
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        default: dev
        type: choice
        options: [dev, prod]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    env:
      # Branch-based stage: main → prod, everything else → dev.
      # workflow_dispatch override: use the manually selected stage.
      STAGE: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.stage
          || (github.ref == 'refs/heads/master' && 'prod' || 'dev')
        }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # next build with output:'export' writes static files to out/
      - name: Build Next.js static export
        run: npx next build

      - name: Verify build output
        run: |
          test -f out/index.html || (echo "❌ out/index.html missing — build failed" && exit 1)
          echo "✅ HTML pages : $(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "✅ Export size: $(du -sh out | cut -f1)"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # serverless-lift's static-website construct:
      #   1. Creates/updates S3 bucket (public, website hosting enabled)
      #   2. Creates/updates CloudFront distribution + ACM cert attachment
      #   3. Uploads the out/ directory to S3
      #   4. Invalidates CloudFront cache
      # S3 website hosting natively serves index.html for directory paths
      # (/connect/success/ → connect/success/index.html) — no CloudFront
      # function needed, which is why static-website is correct here.
      - name: Deploy with Serverless (infra + initial upload)
        uses: serverless/github-action@v3.2
        with:
          args: deploy --stage ${{ env.STAGE }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # serverless-lift uploads all files with a single content-type pass and
      # no differentiated cache headers. The three passes below correct that
      # so Next.js best-practice caching is applied to the live bucket.
      # (serverless-lift's upload already ran; these overwrite with proper headers.)

      # Pass 1: _next/static — content-hashed JS/CSS chunks, safe to cache 1 year.
      - name: Set 1-year cache on _next/static assets
        run: |
          aws s3 sync out/_next/ s3://$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep 'assetsBucketName' | awk '{print $2}')/_next/ \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      # Pass 2: HTML pages — always fetch fresh so users get the latest deploy.
      - name: Set no-cache on HTML pages
        run: |
          BUCKET=$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep 'assetsBucketName' | awk '{print $2}')
          aws s3 sync out/ s3://$BUCKET/ \
            --exclude "_next/*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, no-cache, must-revalidate" \
            --metadata-directive REPLACE

      # Pass 3: Everything else (favicon, robots.txt, etc.) — 1-hour cache.
      - name: Set 1-hour cache on root files
        run: |
          BUCKET=$(npx serverless info --stage ${{ env.STAGE }} --verbose | grep 'assetsBucketName' | awk '{print $2}')
          aws s3 sync out/ s3://$BUCKET/ \
            --exclude "_next/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE
