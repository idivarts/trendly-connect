name: Deploy Trendly Connect

on:
  push:
    branches:
      - main   # → prod
      - dev    # → dev
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        required: true
        default: dev
        type: choice
        options: [dev, prod]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    env:
      # Branch-based stage: main → prod, everything else → dev.
      # workflow_dispatch override: use the manually selected stage.
      STAGE: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.stage
          || (github.ref == 'refs/heads/main' && 'prod' || 'dev')
        }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────────
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # ── Dependencies ──────────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── Build ─────────────────────────────────────────────────────────────────
      # next build with output:'export' writes static files to out/
      - name: Build Next.js static export
        run: npx next build

      - name: Verify build output
        run: |
          test -f out/index.html || (echo "❌ out/index.html missing — build failed" && exit 1)
          echo "✅ HTML pages : $(find out -name '*.html' | wc -l | tr -d ' ')"
          echo "✅ Export size: $(du -sh out | cut -f1)"

      # ── AWS credentials ───────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ── Infrastructure deploy ─────────────────────────────────────────────────
      # Creates/updates: S3 bucket, CloudFront OAC, CloudFront Function,
      # CloudFront distribution, Route53 A+AAAA records.
      # Safe to re-run — CloudFormation is idempotent.
      - name: Deploy infrastructure
        run: npx serverless deploy --stage ${{ env.STAGE }} --verbose

      # ── Read stack outputs ────────────────────────────────────────────────────
      # The serverless.yaml exports BucketName and DistributionId so we can
      # reference them here without hardcoding.
      - name: Read CloudFormation stack outputs
        id: stack
        run: |
          STACK_NAME="trendly-connect-${{ env.STAGE }}"

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`BucketName`].OutputValue' \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue' \
            --output text)

          echo "bucket=$BUCKET"      >> $GITHUB_OUTPUT
          echo "distribution_id=$DIST_ID" >> $GITHUB_OUTPUT

          echo "S3 bucket      : $BUCKET"
          echo "CloudFront ID  : $DIST_ID"

      # ── Static file upload (three passes for correct cache headers) ───────────

      # Pass 1: _next/static — content-hashed JS/CSS, safe to cache 1 year.
      - name: Upload _next/static assets (1-year immutable cache)
        run: |
          aws s3 sync out/_next/ s3://${{ steps.stack.outputs.bucket }}/_next/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata-directive REPLACE

      # Pass 2: HTML pages — always fetch fresh (no CDN caching).
      - name: Upload HTML pages (no-cache)
        run: |
          aws s3 sync out/ s3://${{ steps.stack.outputs.bucket }}/ \
            --delete \
            --exclude "_next/*" \
            --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, no-cache, must-revalidate" \
            --metadata-directive REPLACE

      # Pass 3: Everything else (icons, fonts, robots.txt, sitemap) — 1-hour cache.
      - name: Upload root and SEO files (1-hour cache)
        run: |
          aws s3 sync out/ s3://${{ steps.stack.outputs.bucket }}/ \
            --exclude "_next/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=3600" \
            --metadata-directive REPLACE

      # ── CloudFront cache invalidation ─────────────────────────────────────────
      # Bust the CDN cache so users immediately see the new HTML pages.
      # _next/static is excluded here — those files are content-hashed so old
      # URLs stay valid and new hashes are referenced by the new HTML.
      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.stack.outputs.distribution_id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
